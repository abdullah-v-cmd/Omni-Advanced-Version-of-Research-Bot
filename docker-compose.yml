version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnisynth_postgres
    environment:
      POSTGRES_DB: omnisynth_db
      POSTGRES_USER: omnisynth
      POSTGRES_PASSWORD: omnisynth_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisynth -d omnisynth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisynth_net

  redis:
    image: redis:7-alpine
    container_name: omnisynth_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisynth_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: omnisynth_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnisynth:omnisynth_pass@postgres:5432/omnisynth_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
      - faiss_data:/app/data/faiss_index
      - logs_data:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - omnisynth_net
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnisynth_celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnisynth:omnisynth_pass@postgres:5432/omnisynth_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
      - faiss_data:/app/data/faiss_index
      - logs_data:/app/logs
    depends_on:
      - backend
      - redis
    networks:
      - omnisynth_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnisynth_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - omnisynth_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: omnisynth_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - omnisynth_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  faiss_data:
  logs_data:

networks:
  omnisynth_net:
    driver: bridge
